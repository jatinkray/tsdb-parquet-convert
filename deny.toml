[advisories]
version = 2
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is a pinned Arrow 60 dependency; the target Parqtel writer requires that stack" },
    { id = "RUSTSEC-2026-0542", reason = "humantime is pulled by object_store through chrono; same pinned stack" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is pulled by serde_yaml; inputs are operator-provided config files" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",



    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/parqtel/parqtel-oss"]

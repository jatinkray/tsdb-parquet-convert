[package]
name = "tsdb2parqtel"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Convert Prometheus/Thanos TSDB blocks into Parqtel-compatible Parquet blocks"

[dependencies]
anyhow = { workspace = true }
arrow = { workspace = true }
arrow_array = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
parquet = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true }
parqtel-core = { git = "https://github.com/parqtel/parqtel-oss", rev = "63a9cf1cdc9e8cc4855565b6d0b67fa6c366cef4", version = "0.3.1" }
walkdir = { workspace = true }
xxhash-rust = { workspace = true }
parquet-sink = { version = "0.1.0", path = "../parquet-sink" }
parqtel-sink = { version = "0.1.0", path = "../parqtel-sink" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
tsdb-reader = { version = "0.1.0", path = "../tsdb-reader" }
otlp-sink = { version = "0.1.0", path = "../otlp-sink" }

[[bin]]
name = "tsdb2parqtel"
path = "src/main.rs"

[lints]
workspace = true

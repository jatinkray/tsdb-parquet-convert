name: Release

# Publishes multi-architecture binaries for the workspace version.
#
# Triggers:
#   * push to main that touches the manifest or the crates (a "major change");
#     the release is only produced when `[workspace.package] version` names a
#     version that has no `v<version>` release yet, so ordinary commits on an
#     already-released version are no-ops.
#   * manual dispatch, with `force` to rebuild and overwrite the assets of an
#     existing release (for example after a tag was created by hand).
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and overwrite the assets of an existing release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN: tsdb2parqtel

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Read the workspace version
        run: |
          set -euo pipefail
          version=$(awk '/^\[workspace\.package\]/{found=1; next} /^\[/{found=0} found && /^version *=/{gsub(/[",]/, "", $3); print $3; exit}' Cargo.toml)
          if [ -z "${version}" ]; then
            echo "no [workspace.package] version in Cargo.toml" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "workspace version: ${version}"
      - id: gate
        name: Skip when the version is already released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          force="${{ inputs.force }}"
          if gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "${force}" = "true" ]; then
              echo "release ${tag} exists; rebuilding because force=true"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "release ${tag} already exists; nothing to publish"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            musl: false
          - target: aarch64-apple-darwin
            os: macos-15
            musl: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            musl: false
    runs-on: ${{ matrix.os }}
    # Fat LTO on a cold Intel macOS runner is the slowest leg of the matrix;
    # this bounds a hung runner instead of waiting for the 6h default.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p ${{ env.BIN }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          target="${{ matrix.target }}"
          suffix=""
          if [ "${RUNNER_OS}" = "Windows" ]; then suffix=".exe"; fi
          staging="staging"
          mkdir -p "${staging}" dist
          cp "target/${target}/release/${BIN}${suffix}" "${staging}/"
          cp README.md LICENSE "${staging}/"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            asset="dist/${BIN}-${version}-${target}.zip"
            powershell -NoProfile -Command "Compress-Archive -Path '${staging}/*' -DestinationPath '${asset}' -Force"
          else
            asset="dist/${BIN}-${version}-${target}.tar.gz"
            tar -czf "${asset}" -C "${staging}" .
          fi
          echo "packaged ${asset}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  trust:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: SBOMs
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin >/dev/null
          for archive in dist/*.tar.gz dist/*.zip; do
            [ -e "${archive}" ] || continue
            syft "${archive}" -o spdx-json > "${archive}.spdx.json"
          done
          ls -1 dist/*.spdx.json
      - name: Sign every asset (keyless, OIDC)
        run: |
          set -euo pipefail
          for asset in dist/*.tar.gz dist/*.zip dist/*.spdx.json SHA256SUMS; do
            [ -e "${asset}" ] || continue
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}"
          done
          ls -1 dist/*.sigstore.json | wc -l
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ needs.prepare.outputs.version }}-trust
          path: |
            dist/*.spdx.json
            dist/*.sigstore.json
          if-no-files-found: error
          retention-days: 14

  container:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "${{ env.BIN }}-${{ needs.prepare.outputs.version }}-*-linux-musl"
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push one image per architecture
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          image="ghcr.io/${{ github.repository }}"
          for pair in x86_64:amd64 aarch64:arm64; do
            target="${pair%%:*}"
            platform="${pair##*:}"
            work="ctx-${platform}"
            rm -rf "${work}" && mkdir -p "${work}"
            tar -xzf "dist/${BIN}-${version}-${target}-unknown-linux-musl.tar.gz" -C "${work}"
            docker buildx build \
              --platform "linux/${platform}" \
              --build-arg "BINARY=${BIN}" \
              --file deploy/Dockerfile.binary \
              --tag "${image}:${version}-${platform}" \
              --push "${work}"
          done
      - name: Merge into version and latest tags
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          image="ghcr.io/${{ github.repository }}"
          docker buildx imagetools create \
            --tag "${image}:${version}" \
            --tag "${image}:latest" \
            "${image}:${version}-amd64" \
            "${image}:${version}-arm64"
          docker buildx imagetools inspect "${image}:${version}"

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect archives, SBOMs and signatures
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.spdx.json' -o -name '*.sigstore.json' \) -exec cp {} dist/ \;
          ls -1 dist | sort
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.tar.gz *.zip *.spdx.json *.sigstore.json > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          version="${{ needs.prepare.outputs.version }}"
          if gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "${tag}" dist/* \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "${BIN} ${version}" \
              --generate-notes
          fi
          gh release view "${tag}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'

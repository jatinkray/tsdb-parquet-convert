name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Prometheus oracle
        run: |
          curl -fsSL -o /tmp/prometheus.tar.gz https://github.com/prometheus/prometheus/releases/download/v2.54.0/prometheus-2.54.0.linux-amd64.tar.gz
          tar -xzf /tmp/prometheus.tar.gz -C /tmp prometheus-2.54.0.linux-amd64/promtool
          rm -rf /tmp/promdb && mkdir -p /tmp/promdb/wal
          cp -a crates/tsdb-reader/tests/fixtures/testblock /tmp/promdb/01G0P9P6T0VSA5Z484BRGH2N68
          /tmp/prometheus-2.54.0.linux-amd64/promtool tsdb dump --sandbox-dir-root=/tmp /tmp/promdb > /tmp/promtool.dump
          cargo run --quiet --release --example dump_tsv -- crates/tsdb-reader/tests/fixtures/testblock > /tmp/native.dump
          python3 scripts/check_promtool_oracle.py /tmp/promtool.dump /tmp/native.dump

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p tsdb2parqtel

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tsdb2parqtel:ci

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build pinned Parqtel
        run: |
          git clone --filter=blob:none https://github.com/parqtel/parqtel-oss /tmp/parqtel-oss
          git -C /tmp/parqtel-oss checkout 63a9cf1cdc9e8cc4855565b6d0b67fa6c366cef4
          docker build -t parqtel-e2e /tmp/parqtel-oss
      - run: PARQTEL_IMAGE=parqtel-e2e bash scripts/e2e.sh

[workspace]
resolver = "2"
members = [
    "crates/tsdb-reader",
    "crates/parqtel-sink",
    "crates/parquet-sink",
    "crates/otlp-sink",
    "crates/cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Convert Prometheus/Thanos TSDB blocks into Parqtel-compatible Parquet blocks"

[workspace.dependencies]
# Internal crates: `version` is required next to `path` so cargo-deny's
# `wildcards = "deny"` policy keeps passing, and it lives here only, so a
# release bump is `[workspace.package] version` plus these four lines.
tsdb-reader = { path = "crates/tsdb-reader", version = "1.0.0" }
parqtel-sink = { path = "crates/parqtel-sink", version = "1.0.0" }
parquet-sink = { path = "crates/parquet-sink", version = "1.0.0" }
otlp-sink = { path = "crates/otlp-sink", version = "1.0.0" }
tokio = { version = "1", features = ["full"] }
arrow = { version = "60", features = ["ipc", "json", "csv", "prettyprint"] }
parquet = { version = "60", features = ["zstd", "async", "encryption"] }
arrow_array = { package = "arrow-array", version = "60" }
arrow_schema = { package = "arrow-schema", version = "60" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "v5", "fast-rng"] }
tempfile = "3"
futures = "0.3"
zstd = "0.14"
ahash = "0.8"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
crc32c = "0.6"
regex = "1"
serde_yaml = "0.9"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bytes = "1"
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "metrics"] }
prost = "0.14"
tsdb-reader-upstream = { package = "tsdb-reader", version = "0.1.0", default-features = false }
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
opt-level = 3
